<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Mario Drawing World</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1c2330;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: monospace; color: #fff;
    overflow: hidden;
  }
  #wrap { position: relative; }
  canvas {
    border: 6px solid #111;
    border-radius: 6px;
    image-rendering: pixelated;
    background: #5c94fc;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    max-width: 96vw;
    max-height: 86vh;
  }
  .bar {
    display: flex; justify-content: space-between;
    width: 100%; max-width: 800px;
    padding: 8px 4px; font-size: 14px; opacity: 0.85;
  }
  .start { color: #4cc24c; font-weight: bold; }
  .exit { color: #e23b3b; font-weight: bold; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
</div>
<div class="bar">
  <span class="start">START &gt; press ENTER</span>
  <span>Arrows move · Space jump · Shift run · Left Alt fireball · P pause</span>
  <span class="exit">BOSS</span>
</div>
<script>
// ============================================================
// CONSTANTS
// ============================================================
const CANVAS_WIDTH = 800;
const CANVAS_HEIGHT = 600;
const GROUND_Y = 540;
const LEVEL_WIDTH = 6000;
const GRAVITY = 0.7;
const MAX_FALL_SPEED = 14;
const PLAYER_SPEED = 3.4;
const PLAYER_RUN_SPEED = 5.2;
const JUMP_VELOCITY = -14;
const FRICTION = 0.82;
const AIR_FRICTION = 0.92;
const PLAYER_SMALL_W = 28;
const PLAYER_SMALL_H = 32;
const PLAYER_BIG_W = 32;
const PLAYER_BIG_H = 56;
const INVINCIBLE_TIME = 120;
const STATE = { MENU: 'MENU', PLAYING: 'PLAYING', PAUSED: 'PAUSED', GAME_OVER: 'GAME_OVER', WIN: 'WIN' };
const POWER = { SMALL: 0, BIG: 1, FIRE: 2 };
const COLORS = {
  sky1: '#5fb8ff', sky2: '#bfe9ff', ground: '#7a4a1e', groundTop: '#3fa53f',
  red: '#e23b3b', orange: '#f08a1d', green: '#4cc24c', blue: '#3b7de2',
  pink: '#f06fae', purple: '#8b3bd6', cyan: '#3bd6d6', yellow: '#ffd23b',
  coin: '#ffd23b', qblock: '#f0a81d', brick: '#b5651d', white: '#ffffff', black: '#1a1a1a',
};
const SCORE_COIN = 100;
const SCORE_STOMP = 200;
const SCORE_FIRE = 200;
const SCORE_BOSS = 5000;

// ============================================================
// INPUT
// ============================================================
class Input {
  constructor() {
    this.keys = {};
    this.pressed = {};
    this._down = {};
    window.addEventListener('keydown', (e) => {
      if (this._isGameKey(e.code)) e.preventDefault();
      if (!this.keys[e.code]) this._down[e.code] = true;
      this.keys[e.code] = true;
    });
    window.addEventListener('keyup', (e) => {
      if (this._isGameKey(e.code)) e.preventDefault();
      this.keys[e.code] = false;
    });
  }
  _isGameKey(code) {
    return ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','AltLeft','KeyP','Enter','ShiftLeft'].includes(code);
  }
  update() { this.pressed = this._down; this._down = {}; }
  isDown(code) { return !!this.keys[code]; }
  justPressed(code) { return !!this.pressed[code]; }
  get left() { return this.isDown('ArrowLeft'); }
  get right() { return this.isDown('ArrowRight'); }
  get jump() { return this.isDown('Space') || this.isDown('ArrowUp'); }
  get jumpPressed() { return this.justPressed('Space') || this.justPressed('ArrowUp'); }
  get run() { return this.isDown('ShiftLeft'); }
  get firePressed() { return this.justPressed('AltLeft'); }
}

// ============================================================
// CAMERA
// ============================================================
class Camera {
  constructor() { this.x = 0; this.y = 0; }
  follow(target) {
    const desired = target.x + target.w / 2 - CANVAS_WIDTH * 0.4;
    this.x += (desired - this.x) * 0.12;
    if (this.x < 0) this.x = 0;
    if (this.x > LEVEL_WIDTH - CANVAS_WIDTH) this.x = LEVEL_WIDTH - CANVAS_WIDTH;
  }
}

// ============================================================
// PHYSICS
// ============================================================
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function resolveCollisions(ent, solids) {
  const result = { onGround: false, hitBelow: [], hitTop: false };
  ent.x += ent.vx;
  for (const s of solids) {
    if (s.dead) continue;
    if (aabb(ent, s)) {
      if (ent.vx > 0) ent.x = s.x - ent.w;
      else if (ent.vx < 0) ent.x = s.x + s.w;
      ent.vx = 0;
    }
  }
  ent.y += ent.vy;
  for (const s of solids) {
    if (s.dead) continue;
    if (aabb(ent, s)) {
      if (ent.vy > 0) {
        ent.y = s.y - ent.h;
        ent.vy = 0;
        result.onGround = true;
      } else if (ent.vy < 0) {
        ent.y = s.y + s.h;
        ent.vy = 0;
        result.hitBelow.push(s);
      }
    }
  }
  return result;
}

// ============================================================
// RENDERER
// ============================================================
class Renderer {
  constructor(ctx) { this.ctx = ctx; }
  clear() {
    const ctx = this.ctx;
    const g = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
    g.addColorStop(0, COLORS.sky1);
    g.addColorStop(1, COLORS.sky2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  }
  drawBackground(camX) {
    const ctx = this.ctx;
    ctx.fillStyle = '#79d279';
    for (let i = 0; i < 12; i++) {
      const bx = i * 600 - (camX * 0.5) % 600 - 300;
      this._hill(bx + 150, 540, 120);
      this._hill(bx + 450, 540, 80);
    }
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 14; i++) {
      const cx = (i * 480 - camX * 0.3) % (480 * 14);
      const x = cx < -200 ? cx + 480 * 14 : cx;
      const y = 60 + (i % 3) * 50;
      this._cloud(x, y);
    }
  }
  _hill(x, baseY, r) {
    const ctx = this.ctx;
    ctx.beginPath();
    ctx.arc(x, baseY, r, Math.PI, 0);
    ctx.fill();
  }
  _cloud(x, y) {
    const ctx = this.ctx;
    ctx.beginPath();
    ctx.arc(x, y, 22, 0, Math.PI * 2);
    ctx.arc(x + 26, y + 6, 28, 0, Math.PI * 2);
    ctx.arc(x + 56, y, 22, 0, Math.PI * 2);
    ctx.arc(x + 28, y - 12, 22, 0, Math.PI * 2);
    ctx.fill();
  }
  platform(x, y, w, h, color) {
    const ctx = this.ctx;
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(x, y, w, 4);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x, y + h - 4, w, 4);
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  }
  rect(x, y, w, h, color) { this.ctx.fillStyle = color; this.ctx.fillRect(x, y, w, h); }
  px(x, y, w, h, color) { this.ctx.fillStyle = color; this.ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h)); }
}

// ============================================================
// COIN
// ============================================================
class Coin {
  constructor(x, y) {
    this.x = x; this.y = y; this.w = 18; this.h = 22;
    this.dead = false;
    this.anim = Math.floor(Math.random() * 40);
    this.popVy = 0; this.popping = false; this.popTimer = 0;
  }
  static pop(x, y) {
    const c = new Coin(x, y);
    c.popping = true; c.popVy = -9; c.popTimer = 40;
    return c;
  }
  update() {
    this.anim++;
    if (this.popping) {
      this.y += this.popVy;
      this.popVy += 0.6;
      this.popTimer--;
      if (this.popTimer <= 0) this.dead = true;
    }
  }
  draw(r, cam) {
    const ctx = r.ctx;
    const x = this.x - cam.x;
    const y = this.y;
    const phase = Math.abs(Math.sin(this.anim * 0.12));
    const ww = 4 + this.w * phase;
    const cx = x + this.w / 2;
    ctx.fillStyle = COLORS.coin;
    ctx.beginPath();
    ctx.ellipse(cx, y + this.h / 2, ww / 2, this.h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2; ctx.stroke();
    if (ww > 10) { ctx.fillStyle = '#fff6c0'; ctx.fillRect(cx - 1, y + 4, 2, this.h - 8); }
  }
}

// ============================================================
// POWERUP
// ============================================================
class PowerUp {
  constructor(x, y, kind) {
    this.kind = kind;
    this.x = x; this.y = y; this.w = 28; this.h = 28;
    this.targetY = y - 30;
    this.vx = kind === 'mushroom' ? 1.4 : 0;
    this.vy = 0;
    this.dead = false; this.emerging = true; this.anim = 0;
  }
  update(solids) {
    this.anim++;
    if (this.emerging) {
      this.y -= 1;
      if (this.y <= this.targetY) this.emerging = false;
      return;
    }
    if (this.kind === 'flower') return;
    this.vy += GRAVITY;
    if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
    const prevX = this.x;
    resolveCollisions(this, solids);
    if (this.x === prevX && this.vx !== 0) this.vx = -this.vx;
  }
  draw(r, cam) {
    const ctx = r.ctx;
    const x = this.x - cam.x;
    const y = this.y;
    if (this.kind === 'mushroom') {
      ctx.fillStyle = '#ffe7c2';
      ctx.fillRect(x + 6, y + 14, this.w - 12, 14);
      ctx.fillStyle = COLORS.red;
      ctx.beginPath();
      ctx.arc(x + this.w / 2, y + 14, this.w / 2, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(x, y + 14, this.w, 4);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x + 8, y + 10, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 20, y + 9, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.fillRect(x + 9, y + 18, 3, 5);
      ctx.fillRect(x + 16, y + 18, 3, 5);
    } else {
      const t = Math.floor(this.anim / 8) % 2;
      ctx.fillStyle = '#2faf2f';
      ctx.fillRect(x + 12, y + 16, 4, 12);
      ctx.fillStyle = t ? '#ff5a1d' : '#ffd23b';
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(x + 14 + Math.cos(a) * 8, y + 10 + Math.sin(a) * 8, 6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = t ? '#ffd23b' : '#ff5a1d';
      ctx.beginPath(); ctx.arc(x + 14, y + 10, 6, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ============================================================
// PROJECTILES
// ============================================================
class Fireball {
  constructor(x, y, dir) {
    this.x = x; this.y = y; this.w = 14; this.h = 14;
    this.vx = 6 * dir; this.vy = 2;
    this.dead = false; this.life = 160; this.anim = 0;
  }
  update(solids) {
    this.anim++; this.life--;
    if (this.life <= 0) { this.dead = true; return; }
    this.vy += GRAVITY * 0.7;
    if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
    const prevX = this.x;
    const res = resolveCollisions(this, solids);
    if (res.onGround) this.vy = -6;
    if (this.x === prevX) this.dead = true;
    if (this.y > 800) this.dead = true;
  }
  draw(r, cam) {
    const ctx = r.ctx;
    const cx = this.x - cam.x + this.w / 2;
    const cy = this.y + this.h / 2;
    const t = Math.floor(this.anim / 4) % 2;
    ctx.fillStyle = t ? '#ff5a1d' : '#ffd23b';
    ctx.beginPath(); ctx.arc(cx, cy, this.w / 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = t ? '#ffd23b' : '#ff5a1d';
    ctx.beginPath(); ctx.arc(cx, cy, this.w / 4, 0, Math.PI * 2); ctx.fill();
  }
}

class BossShot {
  constructor(x, y, vx, vy) {
    this.x = x; this.y = y; this.w = 18; this.h = 18;
    this.vx = vx; this.vy = vy;
    this.dead = false; this.life = 200; this.anim = 0;
  }
  update() {
    this.anim++; this.life--;
    this.x += this.vx; this.y += this.vy;
    if (this.life <= 0) this.dead = true;
  }
  draw(r, cam) {
    const ctx = r.ctx;
    const cx = this.x - cam.x + this.w / 2;
    const cy = this.y + this.h / 2;
    const t = Math.floor(this.anim / 4) % 2;
    ctx.fillStyle = t ? '#a020f0' : '#d060ff';
    ctx.beginPath(); ctx.arc(cx, cy, this.w / 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
  }
}

// ============================================================
// ENEMY
// ============================================================
class Enemy {
  constructor(x, y, type = 'goomba') {
    this.type = type;
    this.x = x; this.w = 30;
    this.h = type === 'spiky' ? 34 : 28;
    this.y = y - this.h;
    this.vx = type === 'spiky' ? -0.7 : -1.1;
    this.vy = 0;
    this.dead = false; this.squashTimer = 0;
    this.animTimer = Math.floor(Math.random() * 30);
    this.active = false; this.dying = false;
  }
  get stompable() { return this.type === 'goomba'; }
  squash() { this.squashTimer = 22; this.vx = 0; }
  kill() { this.dead = true; this.dying = true; this.vy = -6; }
  update(solids, player) {
    if (this.dead) return;
    if (this.squashTimer > 0) {
      this.squashTimer--;
      if (this.squashTimer === 0) this.dead = true;
      return;
    }
    if (this.dying) { this.vy += GRAVITY; this.y += this.vy; return; }
    this.animTimer++;
    if (!this.active) {
      if (Math.abs(this.x - player.x) < 520) this.active = true;
      else return;
    }
    this.vy += GRAVITY;
    if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
    const prevX = this.x;
    const res = resolveCollisions(this, solids);
    if (this.x === prevX && this.vx !== 0) this.vx = -this.vx;
    const sp = this.type === 'spiky' ? 0.7 : 1.1;
    if (this.vx > 0) this.vx = sp; else if (this.vx < 0) this.vx = -sp;
    if (res.onGround) {
      const aheadX = this.vx > 0 ? this.x + this.w + 2 : this.x - 2;
      const footY = this.y + this.h + 4;
      let groundAhead = false;
      for (const s of solids) {
        if (s.dead) continue;
        if (aheadX >= s.x && aheadX <= s.x + s.w && footY >= s.y && footY <= s.y + s.h + 6) {
          groundAhead = true; break;
        }
      }
      if (!groundAhead) this.vx = -this.vx;
    }
  }
  draw(r, cam) {
    const ctx = r.ctx;
    const x = Math.floor(this.x - cam.x);
    const y = Math.floor(this.y);
    const w = this.w, h = this.h;
    if (this.squashTimer > 0) {
      ctx.fillStyle = '#8a5a2b';
      ctx.fillRect(x, y + h - 8, w, 8);
      return;
    }
    if (this.type === 'goomba') this._drawGoomba(ctx, x, y, w, h);
    else this._drawSpiky(ctx, x, y, w, h);
  }
  _drawGoomba(ctx, x, y, w, h) {
    const flip = this.dying ? -1 : 1;
    ctx.save();
    if (flip < 0) { ctx.translate(x, y + h); ctx.scale(1, -1); ctx.translate(-x, -y); }
    ctx.fillStyle = '#9c5a22';
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h * 0.4, w / 2, h * 0.4, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(x, y + h * 0.4, w, h * 0.35);
    const wig = Math.floor(this.animTimer / 12) % 2;
    ctx.fillStyle = '#5a2d0c';
    ctx.fillRect(x + (wig ? 2 : 5), y + h - 8, 8, 8);
    ctx.fillRect(x + w - (wig ? 10 : 13), y + h - 8, 8, 8);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 6, y + h * 0.32, 6, 7);
    ctx.fillRect(x + w - 12, y + h * 0.32, 6, 7);
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 9, y + h * 0.34, 3, 5);
    ctx.fillRect(x + w - 10, y + h * 0.34, 3, 5);
    ctx.fillRect(x + 5, y + h * 0.28, 8, 2);
    ctx.fillRect(x + w - 13, y + h * 0.28, 8, 2);
    ctx.restore();
  }
  _drawSpiky(ctx, x, y, w, h) {
    ctx.fillStyle = '#8a8f99';
    ctx.fillRect(x, y + 10, w, h - 14);
    ctx.fillStyle = '#6b7079';
    ctx.fillRect(x, y + h - 6, w, 6);
    ctx.fillStyle = '#cfd4dd';
    const n = 3, sw = w / n;
    for (let i = 0; i < n; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * sw, y + 12);
      ctx.lineTo(x + i * sw + sw / 2, y - 2);
      ctx.lineTo(x + i * sw + sw, y + 12);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 6, y + 16, 6, 6);
    ctx.fillRect(x + w - 12, y + 16, 6, 6);
    ctx.fillStyle = '#c00';
    ctx.fillRect(x + 8, y + 18, 3, 3);
    ctx.fillRect(x + w - 10, y + 18, 3, 3);
  }
}

// ============================================================
// BOSS
// ============================================================
class Boss {
  constructor(x, y, leftBound, rightBound) {
    this.w = 90; this.h = 96;
    this.x = x; this.y = y - this.h;
    this.vx = -1.4; this.vy = 0;
    this.leftBound = leftBound; this.rightBound = rightBound;
    this.hp = 3; this.dead = false; this.defeated = false;
    this.hitFlash = 0; this.shootTimer = 90; this.anim = 0;
    this.active = false; this.deathTimer = 0;
  }
  get stompable() { return true; }
  takeHit() {
    if (this.hitFlash > 0 || this.defeated) return false;
    this.hp--;
    this.hitFlash = 60;
    if (this.hp <= 0) { this.defeated = true; this.deathTimer = 120; this.vx = 0; }
    return this.defeated;
  }
  update(solids, player, game) {
    if (this.dead) return;
    this.anim++;
    if (this.hitFlash > 0) this.hitFlash--;
    if (this.defeated) {
      this.deathTimer--;
      this.vy += GRAVITY;
      this.y += this.vy;
      this.x += Math.sin(this.anim * 0.3) * 2;
      if (this.deathTimer <= 0) this.dead = true;
      return;
    }
    if (!this.active) {
      if (Math.abs(this.x - player.x) < 600) this.active = true;
      else return;
    }
    this.vy += GRAVITY;
    if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
    resolveCollisions(this, solids);
    if (this.x <= this.leftBound) { this.x = this.leftBound; this.vx = Math.abs(this.vx); }
    if (this.x + this.w >= this.rightBound) { this.x = this.rightBound - this.w; this.vx = -Math.abs(this.vx); }
    this.shootTimer--;
    if (this.shootTimer <= 0) {
      this.shootTimer = 110;
      const dir = player.x < this.x ? -1 : 1;
      const sx = this.x + this.w / 2, sy = this.y + 30;
      game.bossShots.push(new BossShot(sx, sy, dir * 4, -1.5));
      game.bossShots.push(new BossShot(sx, sy, dir * 5, 1));
    }
  }
  draw(r, cam) {
    const ctx = r.ctx;
    const x = Math.floor(this.x - cam.x);
    const y = Math.floor(this.y);
    const w = this.w, h = this.h;
    if (this.hitFlash > 0 && Math.floor(this.hitFlash / 4) % 2) ctx.globalAlpha = 0.5;
    const body = COLORS.orange, dark = '#b8600f', light = '#ffc04d';
    ctx.fillStyle = body; ctx.fillRect(x, y + 18, w, h - 18);
    ctx.fillStyle = dark; ctx.fillRect(x, y + h - 12, w, 12);
    ctx.fillStyle = light; ctx.fillRect(x, y + 18, w, 6);
    ctx.fillStyle = COLORS.yellow; ctx.fillRect(x + 14, y, w - 28, 34);
    ctx.fillStyle = dark;
    ctx.fillRect(x + 10, y - 8, 16, 16); ctx.fillRect(x + w - 26, y - 8, 16, 16);
    ctx.fillStyle = COLORS.yellow;
    ctx.fillRect(x + 14, y - 4, 8, 8); ctx.fillRect(x + w - 22, y - 4, 8, 8);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 26, y + 8, 12, 12); ctx.fillRect(x + w - 38, y + 8, 12, 12);
    ctx.fillStyle = '#000';
    const look = this.vx < 0 ? 0 : 4;
    ctx.fillRect(x + 28 + look, y + 11, 6, 8); ctx.fillRect(x + w - 36 + look, y + 11, 6, 8);
    ctx.fillStyle = dark;
    ctx.fillRect(x + 24, y + 5, 14, 3); ctx.fillRect(x + w - 38, y + 5, 14, 3);
    ctx.fillRect(x + w / 2 - 8, y + 22, 16, 8);
    ctx.fillStyle = body;
    const swing = Math.sin(this.anim * 0.1) * 4;
    ctx.fillRect(x - 8, y + 30 + swing, 12, 30); ctx.fillRect(x + w - 4, y + 30 - swing, 12, 30);
    ctx.fillStyle = light; ctx.fillRect(x + w / 2 - 18, y + 44, 36, 30);
    ctx.globalAlpha = 1;
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < this.hp ? '#e23636' : '#444';
      ctx.fillRect(x + 18 + i * 20, y - 22, 14, 8);
    }
    ctx.globalAlpha = 1;
  }
}

// ============================================================
// PLAYER
// ============================================================
class Player {
  constructor(x, y) { this.startX = x; this.startY = y; this.reset(x, y); }
  reset(x, y) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.w = PLAYER_SMALL_W; this.h = PLAYER_SMALL_H;
    this.facing = 1; this.onGround = false;
    this.power = POWER.SMALL; this.invincible = 0;
    this.dead = false; this.deathTimer = 0;
    this.animTimer = 0; this.fireCooldown = 0;
  }
  get big() { return this.power !== POWER.SMALL; }
  _applySize() {
    const wasBig = this.h > PLAYER_SMALL_H;
    if (this.big && !wasBig) {
      const feet = this.y + this.h;
      this.w = PLAYER_BIG_W; this.h = PLAYER_BIG_H;
      this.y = feet - this.h;
    } else if (!this.big && wasBig) {
      const feet = this.y + this.h;
      this.w = PLAYER_SMALL_W; this.h = PLAYER_SMALL_H;
      this.y = feet - this.h;
    }
  }
  powerUp(kind) {
    if (kind === 'mushroom') { if (this.power === POWER.SMALL) { this.power = POWER.BIG; this._applySize(); } }
    else if (kind === 'flower') { this.power = POWER.FIRE; this._applySize(); }
  }
  takeDamage() {
    if (this.invincible > 0 || this.dead) return false;
    if (this.power === POWER.FIRE) { this.power = POWER.BIG; this.invincible = INVINCIBLE_TIME; }
    else if (this.power === POWER.BIG) { this.power = POWER.SMALL; this._applySize(); this.invincible = INVINCIBLE_TIME; }
    else { this.die(); return true; }
    return false;
  }
  die() { this.dead = true; this.deathTimer = 90; this.vy = -12; this.vx = 0; }
  update(input, solids, game) {
    if (this.dead) { this.deathTimer--; this.vy += GRAVITY; this.y += this.vy; return; }
    if (this.invincible > 0) this.invincible--;
    if (this.fireCooldown > 0) this.fireCooldown--;
    this.animTimer++;
    const speed = input.run ? PLAYER_RUN_SPEED : PLAYER_SPEED;
    if (input.left) { this.vx -= 0.8; this.facing = -1; }
    if (input.right) { this.vx += 0.8; this.facing = 1; }
    if (this.vx > speed) this.vx = speed;
    if (this.vx < -speed) this.vx = -speed;
    if (!input.left && !input.right) {
      this.vx *= this.onGround ? FRICTION : AIR_FRICTION;
      if (Math.abs(this.vx) < 0.1) this.vx = 0;
    }
    if (input.jumpPressed && this.onGround) { this.vy = JUMP_VELOCITY; this.onGround = false; }
    if (!input.jump && this.vy < -4) this.vy = -4;
    this.vy += GRAVITY;
    if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
    if (input.firePressed && this.power === POWER.FIRE && this.fireCooldown <= 0) {
      game.spawnFireball(this); this.fireCooldown = 20;
    }
    const res = resolveCollisions(this, solids);
    this.onGround = res.onGround;
    for (const block of res.hitBelow) { if (block.onBump) block.onBump(game); }
    if (this.y > 800) this.die();
    if (this.x < 0) { this.x = 0; this.vx = 0; }
  }
  draw(r, cam) {
    if (this.dead && this.deathTimer < 60 && Math.floor(this.deathTimer / 4) % 2) return;
    if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2) return;
    const ctx = r.ctx;
    const x = Math.floor(this.x - cam.x);
    const y = Math.floor(this.y);
    const w = this.w, h = this.h;
    const cap = this.power === POWER.FIRE ? COLORS.white : COLORS.red;
    const skin = '#ffcc99';
    const overall = COLORS.blue;
    ctx.save();
    if (this.facing < 0) { ctx.translate(x + w, y); ctx.scale(-1, 1); }
    else ctx.translate(x, y);
    const u = w / 14, v = h / 16;
    const P = (px, py, pw, ph, c) => { ctx.fillStyle = c; ctx.fillRect(px * u, py * v, pw * u, ph * v); };
    P(3, 0, 9, 2, cap); P(2, 2, 11, 2, cap);
    P(3, 4, 9, 4, skin);
    P(2, 4, 1, 3, '#5a2d0c');
    P(8, 5, 1, 2, COLORS.black);
    P(6, 7, 6, 1, '#5a2d0c');
    P(3, 8, 8, 4, overall);
    P(2, 8, 1, 3, cap); P(11, 8, 1, 3, skin);
    P(5, 9, 1, 1, COLORS.yellow); P(8, 9, 1, 1, COLORS.yellow);
    if (h > 40) {
      P(4, 12, 3, 4, overall); P(8, 12, 3, 4, overall);
      P(3, 15, 3, 1, '#5a2d0c'); P(8, 15, 3, 1, '#5a2d0c');
    } else {
      P(4, 12, 3, 3, overall); P(8, 12, 3, 3, overall);
      P(3, 14, 3, 2, '#5a2d0c'); P(8, 14, 3, 2, '#5a2d0c');
    }
    ctx.restore();
  }
}

// ============================================================
// LEVEL
// ============================================================
class Platform {
  constructor(x, y, w, h, color) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.color = color; this.dead = false; this.kind = 'platform';
  }
  draw(r, cam) { r.platform(Math.floor(this.x - cam.x), Math.floor(this.y), this.w, this.h, this.color); }
}

class QuestionBlock {
  constructor(x, y, contents = 'coin') {
    this.x = x; this.y = y; this.w = 36; this.h = 36;
    this.contents = contents; this.used = false; this.dead = false;
    this.bump = 0; this.anim = Math.floor(Math.random() * 60); this.kind = 'qblock';
  }
  onBump(game) {
    if (this.used) return;
    this.used = true; this.bump = 8;
    if (this.contents === 'coin') game.collectBlockCoin(this.x + this.w / 2 - 9, this.y - 4);
    else game.spawnPowerUp(this.x + 4, this.y - 4, this.contents);
  }
  update() { this.anim++; if (this.bump > 0) this.bump--; }
  draw(r, cam) {
    const ctx = r.ctx;
    const x = Math.floor(this.x - cam.x);
    const yOff = this.bump > 0 ? -Math.sin((this.bump / 8) * Math.PI) * 8 : 0;
    const y = Math.floor(this.y + yOff);
    const w = this.w, h = this.h;
    if (this.used) {
      ctx.fillStyle = '#a8772f'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#7a531c'; ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
      ctx.strokeStyle = '#5a3c12'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
      return;
    }
    const t = Math.floor(this.anim / 18) % 3;
    ctx.fillStyle = t === 2 ? '#d98e10' : COLORS.qblock;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x, y, w, 4);
    ctx.strokeStyle = '#7a531c'; ctx.lineWidth = 3; ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
    ctx.fillStyle = '#7a531c';
    for (const [cx, cy] of [[5,5],[w-9,5],[5,h-9],[w-9,h-9]]) ctx.fillRect(x+cx, y+cy, 4, 4);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', x + w / 2, y + h / 2 + 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
}

function buildLevel() {
  const platforms = [], qblocks = [], enemies = [], coins = [];
  let boss = null;
  const groundH = 600 - GROUND_Y + 60;
  const addGround = (x, w) => platforms.push(new Platform(x, GROUND_Y, w, groundH, COLORS.ground));
  addGround(0, 1500); addGround(1560, 1000); addGround(2620, 1300); addGround(3980, LEVEL_WIDTH - 3980);
  const P = (x, y, w, h, c) => platforms.push(new Platform(x, y, w, h, c));
  const Q = (x, y, c) => { const q = new QuestionBlock(x, y, c); qblocks.push(q); return q; };
  const C = (x, y) => coins.push(new Coin(x, y));
  const E = (x, type) => enemies.push(new Enemy(x, GROUND_Y, type));
  const Eon = (x, y, type) => enemies.push(new Enemy(x, y, type));
  // Start zone
  P(0, 200, 60, GROUND_Y - 200, COLORS.red); P(0, 200, 60, 40, COLORS.pink);
  P(140, 440, 90, 24, COLORS.orange); P(280, 360, 90, 24, COLORS.green);
  E(220, 'spiky'); E(330, 'spiky'); E(120, 'spiky');
  C(160, 400); C(190, 400); C(310, 320);
  // Mid zone
  P(450, 430, 110, 24, COLORS.blue); P(620, 350, 110, 24, COLORS.purple);
  P(820, 430, 120, 24, COLORS.cyan); P(1050, 360, 120, 24, COLORS.pink);
  P(1280, 300, 120, 24, COLORS.green); P(1620, 430, 140, 24, COLORS.orange);
  P(1850, 350, 120, 24, COLORS.blue);
  Q(560, 360, 'coin'); Q(600, 360, 'mushroom'); Q(640, 360, 'coin');
  Q(1120, 270, 'coin'); Q(1300, 210, 'flower');
  for (let i = 0; i < 5; i++) C(470 + i * 22, 395);
  for (let i = 0; i < 4; i++) C(840 + i * 22, 395);
  for (let i = 0; i < 4; i++) C(1070 + i * 22, 320);
  for (let i = 0; i < 4; i++) C(1290 + i * 22, 260);
  E(700, 'goomba'); E(900, 'goomba'); E(1180, 'goomba'); E(1700, 'goomba');
  Eon(1290, GROUND_Y - 230, 'goomba');
  // Question block column
  P(2240, GROUND_Y - 220, 50, 220, COLORS.orange);
  for (let i = 0; i < 4; i++) Q(2235, GROUND_Y - 220 - 40 - i * 40, i === 1 ? 'mushroom' : 'coin');
  Q(2120, GROUND_Y - 90, 'coin'); Q(2160, GROUND_Y - 130, 'coin');
  C(2120, GROUND_Y - 130); C(2160, GROUND_Y - 170);
  // Mid-right zone
  P(2760, GROUND_Y - 280, 56, 280, COLORS.blue);
  P(2700, GROUND_Y - 60, 60, 60, COLORS.cyan);
  for (let i = 0; i < 6; i++) C(2640, GROUND_Y - 60 - i * 36);
  Eon(2760, GROUND_Y - 280, 'spiky');
  P(2960, 420, 120, 24, COLORS.pink); P(3160, 350, 120, 24, COLORS.green);
  P(3380, 280, 120, 24, COLORS.purple); P(3620, 380, 140, 24, COLORS.orange);
  P(3880, 320, 120, 24, COLORS.cyan);
  Q(3010, 330, 'flower'); Q(3420, 190, 'coin'); Q(3460, 190, 'coin');
  for (let i = 0; i < 4; i++) C(2980 + i * 22, 385);
  for (let i = 0; i < 4; i++) C(3180 + i * 22, 315);
  for (let i = 0; i < 4; i++) C(3640 + i * 22, 345);
  for (let i = 0; i < 4; i++) C(3900 + i * 22, 285);
  E(3050, 'goomba'); E(3250, 'goomba'); E(3500, 'spiky');
  E(3700, 'goomba'); E(3900, 'goomba');
  Eon(3160, GROUND_Y - 280, 'goomba'); Eon(3620, GROUND_Y - 240, 'goomba');
  P(4150, 430, 120, 24, COLORS.green);
  for (let i = 0; i < 4; i++) C(4170 + i * 22, 395);
  E(4300, 'spiky');
  // Boss zone
  const arenaLeft = 4600, arenaRight = 5950;
  P(5700, 180, 250, GROUND_Y - 180, COLORS.brick);
  for (let i = 0; i < 5; i++) P(5700 + i * 50, 150, 30, 40, COLORS.brick);
  P(5790, GROUND_Y - 110, 70, 110, '#3a2410');
  P(4560, GROUND_Y - 140, 40, 140, COLORS.red); P(4560, GROUND_Y - 140, 40, 24, COLORS.pink);
  P(4900, 380, 130, 24, COLORS.purple); P(5180, 330, 130, 24, COLORS.blue);
  P(5420, 380, 130, 24, COLORS.orange);
  for (let i = 0; i < 4; i++) C(4920 + i * 24, 345);
  for (let i = 0; i < 4; i++) C(5200 + i * 24, 295);
  Q(5180, 250, 'flower');
  E(4720, 'goomba'); E(5000, 'spiky');
  boss = new Boss(5450, GROUND_Y, arenaLeft, arenaRight);
  return {
    platforms, qblocks, enemies, coins, boss,
    get solids() { return [...platforms, ...qblocks]; },
    width: LEVEL_WIDTH,
  };
}

// ============================================================
// GAME
// ============================================================
class Game {
  constructor(ctx, input) {
    this.ctx = ctx; this.input = input;
    this.r = new Renderer(ctx); this.cam = new Camera();
    this.state = STATE.MENU;
    this.score = 0; this.lives = 3; this.coinsCollected = 0;
    this.resetLevel(true);
  }
  resetLevel(fullReset) {
    this.level = buildLevel();
    this.player = new Player(80, GROUND_Y - 60);
    this.cam.x = 0;
    this.fireballs = []; this.bossShots = []; this.powerups = [];
    if (fullReset) { this.score = 0; this.lives = 3; this.coinsCollected = 0; }
  }
  start() { this.state = STATE.PLAYING; this.resetLevel(true); }
  spawnFireball(player) {
    const x = player.facing > 0 ? player.x + player.w : player.x - 14;
    this.fireballs.push(new Fireball(x, player.y + player.h * 0.4, player.facing));
  }
  collectBlockCoin(x, y) {
    this.coinsCollected++; this.score += SCORE_COIN;
    this.level.coins.push(Coin.pop(x, y));
  }
  spawnPowerUp(x, y, kind) { this.powerups.push(new PowerUp(x, y, kind)); }
  update() {
    const input = this.input;
    if (this.state === STATE.MENU) {
      if (input.justPressed('Enter') || input.justPressed('Space')) this.start();
      return;
    }
    if (this.state === STATE.GAME_OVER || this.state === STATE.WIN) {
      if (input.justPressed('Enter')) { this.state = STATE.PLAYING; this.resetLevel(true); }
      return;
    }
    if (this.state === STATE.PLAYING && input.justPressed('KeyP')) { this.state = STATE.PAUSED; return; }
    if (this.state === STATE.PAUSED) { if (input.justPressed('KeyP')) this.state = STATE.PLAYING; return; }
    const lvl = this.level;
    const solids = lvl.solids;
    const p = this.player;
    p.update(input, solids, this);
    this.cam.follow(p);
    for (const q of lvl.qblocks) q.update();
    for (const c of lvl.coins) {
      c.update();
      if (!c.dead && !c.popping && aabb(p, c)) { c.dead = true; this.coinsCollected++; this.score += SCORE_COIN; }
    }
    lvl.coins = lvl.coins.filter(c => !c.dead);
    for (const pu of this.powerups) {
      pu.update(solids);
      if (!pu.dead && aabb(p, pu)) { pu.dead = true; p.powerUp(pu.kind); this.score += 1000; }
    }
    this.powerups = this.powerups.filter(pu => !pu.dead);
    for (const fb of this.fireballs) fb.update(solids);
    this.fireballs = this.fireballs.filter(fb => !fb.dead);
    for (const e of lvl.enemies) {
      e.update(solids, p);
      if (e.dead || e.dying || e.squashTimer > 0) continue;
      for (const fb of this.fireballs) {
        if (!fb.dead && aabb(fb, e)) { fb.dead = true; e.kill(); this.score += SCORE_FIRE; break; }
      }
      if (e.dead || e.squashTimer > 0) continue;
      if (!p.dead && aabb(p, e)) {
        const stomping = p.vy > 0 && (p.y + p.h) - e.y < 22;
        if (stomping && e.stompable) { e.squash(); p.vy = -8; this.score += SCORE_STOMP; }
        else this._hurtPlayer();
      }
    }
    lvl.enemies = lvl.enemies.filter(e => !e.dead || e.dying);
    lvl.enemies = lvl.enemies.filter(e => !(e.dead && e.y > 800));
    const boss = lvl.boss;
    if (boss && !boss.dead) {
      boss.update(solids, p, this);
      for (const fb of this.fireballs) {
        if (!fb.dead && aabb(fb, boss) && !boss.defeated) { fb.dead = true; if (boss.takeHit()) this.score += SCORE_BOSS; }
      }
      if (!p.dead && !boss.defeated && aabb(p, boss)) {
        const stomping = p.vy > 0 && (p.y + p.h) - boss.y < 30;
        if (stomping) { if (boss.takeHit()) this.score += SCORE_BOSS; p.vy = -11; }
        else this._hurtPlayer();
      }
    }
    if (boss && boss.dead) { this.state = STATE.WIN; return; }
    for (const bs of this.bossShots) {
      bs.update();
      if (!bs.dead && !p.dead && aabb(p, bs)) { bs.dead = true; this._hurtPlayer(); }
    }
    this.bossShots = this.bossShots.filter(bs => !bs.dead);
    if (p.dead && p.deathTimer <= 0) this._loseLife();
  }
  _hurtPlayer() { this.player.takeDamage(); }
  _loseLife() {
    this.lives--;
    if (this.lives <= 0) this.state = STATE.GAME_OVER;
    else this.resetLevel(false);
  }
  render() {
    const r = this.r;
    r.clear();
    r.drawBackground(this.cam.x);
    if (this.state === STATE.MENU) { this._drawMenu(); return; }
    const lvl = this.level;
    for (const pl of lvl.platforms) pl.draw(r, this.cam);
    for (const q of lvl.qblocks) q.draw(r, this.cam);
    for (const c of lvl.coins) c.draw(r, this.cam);
    for (const pu of this.powerups) pu.draw(r, this.cam);
    for (const e of lvl.enemies) e.draw(r, this.cam);
    if (lvl.boss && !lvl.boss.dead) lvl.boss.draw(r, this.cam);
    for (const fb of this.fireballs) fb.draw(r, this.cam);
    for (const bs of this.bossShots) bs.draw(r, this.cam);
    this.player.draw(r, this.cam);
    this._drawHUD();
    if (this.state === STATE.PAUSED) this._overlay('PAUSED', 'Press P to resume');
    if (this.state === STATE.GAME_OVER) this._overlay('GAME OVER', 'Press ENTER to restart');
    if (this.state === STATE.WIN) this._drawWin();
  }
  _drawHUD() {
    const ctx = this.ctx;
    for (let i = 0; i < 3; i++) this._heart(24 + i * 34, 28, i < this.lives);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.font = 'bold 22px monospace'; ctx.textAlign = 'left';
    const sTxt = 'SCORE ' + String(this.score).padStart(6, '0');
    ctx.strokeText(sTxt, CANVAS_WIDTH - 230, 36); ctx.fillText(sTxt, CANVAS_WIDTH - 230, 36);
    ctx.font = 'bold 20px monospace';
    ctx.strokeText('COINS ' + this.coinsCollected, CANVAS_WIDTH - 230, 62);
    ctx.fillText('COINS ' + this.coinsCollected, CANVAS_WIDTH - 230, 62);
    const pw = this.player.power;
    const label = pw === POWER.FIRE ? 'FIRE' : pw === POWER.BIG ? 'BIG' : 'SMALL';
    ctx.fillStyle = pw === POWER.FIRE ? '#ff5a1d' : '#fff';
    ctx.strokeText(label, 24, 64); ctx.fillText(label, 24, 64);
  }
  _heart(x, y, full) {
    const ctx = this.ctx;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = full ? '#e23636' : 'rgba(0,0,0,0.35)';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.bezierCurveTo(-12, -8, -12, 8, 0, 14);
    ctx.bezierCurveTo(12, 8, 12, -8, 0, 4);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  _overlay(title, sub) {
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 56px monospace';
    ctx.fillText(title, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 10);
    ctx.font = 'bold 22px monospace';
    ctx.fillText(sub, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 40);
    ctx.fillText('SCORE ' + this.score, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 74);
    ctx.textAlign = 'left';
  }
  _drawWin() {
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(20,10,60,0.7)'; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd23b'; ctx.font = 'bold 60px monospace';
    ctx.fillText('YOU WIN!', CANVAS_WIDTH / 2, 220);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px monospace';
    ctx.fillText('The boss is defeated!', CANVAS_WIDTH / 2, 280);
    ctx.fillText('Final Score: ' + this.score, CANVAS_WIDTH / 2, 330);
    ctx.fillText('Coins: ' + this.coinsCollected, CANVAS_WIDTH / 2, 366);
    ctx.font = 'bold 22px monospace';
    ctx.fillText('Press ENTER to play again', CANVAS_WIDTH / 2, 430);
    ctx.textAlign = 'left';
  }
  _drawMenu() {
    const ctx = this.ctx;
    ctx.textAlign = 'center';
    ctx.fillStyle = COLORS.red; ctx.font = 'bold 64px monospace';
    ctx.fillText('SUPER MARIO', CANVAS_WIDTH / 2, 180);
    ctx.fillStyle = COLORS.green;
    ctx.fillText('DRAWING WORLD', CANVAS_WIDTH / 2, 250);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px monospace';
    ctx.fillText('Press ENTER or SPACE to START', CANVAS_WIDTH / 2, 340);
    ctx.font = '18px monospace'; ctx.fillStyle = '#eee';
    const lines = [
      'Arrow keys: move    Space/Up: jump',
      'Shift: run          Left Alt: shoot fireball (with flower)',
      'P: pause',
      '',
      'Stomp goombas. Spiky enemies need fireballs!',
      'Beat the bear boss to win.',
    ];
    lines.forEach((l, i) => ctx.fillText(l, CANVAS_WIDTH / 2, 400 + i * 28));
    ctx.textAlign = 'left';
  }
}

// ============================================================
// MAIN
// ============================================================
const canvas = document.getElementById('game');
canvas.width = CANVAS_WIDTH;
canvas.height = CANVAS_HEIGHT;
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const input = new Input();
const game = new Game(ctx, input);

const STEP = 1000 / 60;
let last = performance.now();
let acc = 0;

function frame(now) {
  let dt = now - last;
  last = now;
  if (dt > 250) dt = 250;
  acc += dt;
  while (acc >= STEP) { input.update(); game.update(); acc -= STEP; }
  game.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
