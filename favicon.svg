<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#87ceeb"/>
  <!-- Eevee body -->
  <ellipse cx="16" cy="20" rx="9" ry="7" fill="#c8864a"/>
  <!-- Fluffy collar -->
  <ellipse cx="16" cy="15" rx="7" ry="4" fill="#e8d4b0"/>
  <!-- Head -->
  <ellipse cx="16" cy="11" rx="7" ry="6" fill="#c8864a"/>
  <!-- Ears -->
  <polygon points="10,7 7,1 13,5" fill="#c8864a"/>
  <polygon points="22,7 25,1 19,5" fill="#c8864a"/>
  <polygon points="10,7 8,3 12,5" fill="#e8a070"/>
  <polygon points="22,7 24,3 20,5" fill="#e8a070"/>
  <!-- Eyes -->
  <ellipse cx="13" cy="10" rx="2" ry="2.2" fill="#fff"/>
  <ellipse cx="19" cy="10" rx="2" ry="2.2" fill="#fff"/>
  <ellipse cx="13.3" cy="10.2" rx="1.2" ry="1.4" fill="#3a2010"/>
  <ellipse cx="19.3" cy="10.2" rx="1.2" ry="1.4" fill="#3a2010"/>
  <circle cx="13.7" cy="9.6" r="0.4" fill="#fff"/>
  <circle cx="19.7" cy="9.6" r="0.4" fill="#fff"/>
  <!-- Nose -->
  <ellipse cx="16" cy="13" rx="1" ry="0.7" fill="#b06040"/>
  <!-- Tail hint -->
  <path d="M24,22 Q30,18 28,26" stroke="#c8864a" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
