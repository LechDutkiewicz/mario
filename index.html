<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Mario Drawing World</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1c2330;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: monospace; color: #fff;
    overflow: hidden;
  }
  #wrap { position: relative; }
  canvas {
    border: 6px solid #111;
    border-radius: 6px;
    image-rendering: pixelated;
    background: #5c94fc;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    max-width: 96vw;
    max-height: 86vh;
  }
  .bar {
    display: flex; justify-content: space-between;
    width: 100%; max-width: 800px;
    padding: 8px 4px; font-size: 14px; opacity: 0.85;
  }
  .start { color: #4cc24c; font-weight: bold; }
  .exit { color: #e23b3b; font-weight: bold; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="800" height="600"></canvas>
  </div>
  <div class="bar">
    <span class="start">START &gt; press ENTER</span>
    <span>Arrows move · Space jump · Shift run · Alt fireball · P pause</span>
    <span class="exit">EXIT</span>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
