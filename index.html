<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eevee's Adventure</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1a1030;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: monospace; color: #fff;
    overflow: hidden;
  }
  #wrap { position: relative; }
  canvas {
    border: 6px solid #111;
    border-radius: 6px;
    image-rendering: pixelated;
    background: #87ceeb;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    max-width: 96vw;
    max-height: 86vh;
  }
  .bar {
    display: flex; justify-content: space-between;
    width: 100%; max-width: 800px;
    padding: 8px 4px; font-size: 13px; opacity: 0.85;
  }
  .start { color: #c8864a; font-weight: bold; }
  .info  { color: #ddd; }
  .poke  { color: #9b59b6; font-weight: bold; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="800" height="600"></canvas>
  </div>
  <div class="bar">
    <span class="start">START &gt; ENTER</span>
    <span class="info">Arrows move · Space jump · Shift run · Alt Flamethrower · P pause</span>
    <span class="poke">POKEMON</span>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
